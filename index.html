<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0F172A" />
    <title>FinQuest — Master Your Money. Outsmart Your Future.</title>
    <meta name="description" content="FinQuest is an interactive financial literacy game for the Hack2Ignite Innovation Challenge GD-01 track. Master budgeting, debt management, compound interest, and scam detection." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          const saved = localStorage.getItem('finquest_settings_v1');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (parsed && parsed.theme === 'light') {
              document.documentElement.classList.remove('dark');
              document.documentElement.classList.add('light');
              document.addEventListener('DOMContentLoaded', function() {
                document.body.classList.add('theme-clean');
              });
            } else {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen font-sans antialiased overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
